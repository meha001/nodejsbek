<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 1.5rem auto; padding: 0 1rem; }
        pre { background: #f0f0f0; padding: 0.75rem; overflow: auto; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h1>Магазин</h1>
    <h2>Пользователи</h2>
    <pre id="users">загрузка…</pre>
    <h2>Товары</h2>
    <pre id="products">загрузка…</pre>
    <h2>Заказы</h2>
    <pre id="orders">загрузка…</pre>
    <script>
        for (const [id, url] of [['users', '/users'], ['products', '/products'], ['orders', '/orders']]) {
            fetch(url)
                .then((r) => r.json())
                .then((data) => { document.getElementById(id).textContent = JSON.stringify(data, null, 2); })
                .catch((e) => { document.getElementById(id).textContent = e.message; });
        }
    </script>
</body>
</html>
